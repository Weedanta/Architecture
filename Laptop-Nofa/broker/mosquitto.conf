# Local MQTT broker for the collector laptop (Wedanta).
# Used in Block E (so broker CPU can be measured) and to inspect MQTT headers
# without TLS in Wireshark. Start it with:
#   Windows : "C:\Program Files\mosquitto\mosquitto.exe" -c broker\mosquitto.conf -v
#   macOS   : /opt/homebrew/sbin/mosquitto -c broker/mosquitto.conf -v
#   Linux   : mosquitto -c broker/mosquitto.conf -v
# Remember to allow port 1883 through the firewall.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
max_queued_messages 10000
